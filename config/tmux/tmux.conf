# Set standard terminal type inside Tmux
set -g default-terminal "tmux-256color"

# Enable 24-bit RGB true color support for Alacritty
set -as terminal-features ",alacritty:256:RGB"

# Eliminate escape key delay (recommended for Vim/Neovim)
set -s escape-time 0

# Enable mouse support (scrolling and pane clicking in Plasma)
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Change prefix key to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable native terminal clipboard integration (OSC 52 via Alacritty)
set -s set-clipboard on

# Route native Tmux copy commands directly to wl-copy
set -g copy-command 'wl-copy'

# Enable Vi mode keybindings for selection (optional but recommended)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Bind 'prefix + p' to paste directly from the Wayland system clipboard
bind-key p run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (prefix + Shift+h/j/k/l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill pane immediately without confirmation prompt (prefix + x)
bind x kill-pane

# Intuitive pane splitting in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
